<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSerr5 · Repositorios</title>
<meta name="description" content="Todos mis repositorios públicos de GitHub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
  // Aplica el tema guardado antes de pintar para evitar parpadeo
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #5f6673;
    --accent: #2f6feb;
    --accent-soft: rgba(47, 111, 235, .10);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .04);
    --shadow-hover: 0 4px 16px rgba(16, 24, 40, .08);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1f2630;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, .12);
    --shadow: none;
    --shadow-hover: 0 4px 20px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1f2630;
      --border: #2a313c;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, .12);
      --shadow: none;
      --shadow-hover: 0 4px 20px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  /* Barra superior */
  .topbar {
    display: flex; justify-content: flex-end; padding: 16px 0 0;
  }
  .theme-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
    box-shadow: var(--shadow);
  }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn svg { width: 16px; height: 16px; }

  /* Perfil */
  .profile {
    display: flex; gap: 24px; align-items: center;
    padding: 32px 0 28px;
  }
  .avatar {
    width: 104px; height: 104px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface-2);
    flex-shrink: 0; object-fit: cover;
  }
  .profile h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .profile .login { color: var(--muted); font-size: 16px; }
  .profile .bio { margin: 8px 0 0; color: var(--text); max-width: 60ch; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px;
    color: var(--muted); font-size: 14px;
  }
  .meta span, .meta a { display: inline-flex; align-items: center; gap: 6px; }
  .meta a:hover { color: var(--accent); }
  .meta b { color: var(--text); font-weight: 600; }
  .meta svg { width: 16px; height: 16px; }

  /* Controles */
  .controls {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px;
    align-items: center; padding: 16px 0;
    border-top: 1px solid var(--border);
  }
  .search {
    position: relative;
  }
  .search svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  }
  input[type="search"], select {
    width: 100%; font: inherit; font-size: 14px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; outline: none;
  }
  input[type="search"] { padding-left: 36px; }
  input[type="search"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select { cursor: pointer; padding-right: 28px; }
  .check {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
    color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none;
  }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .count { color: var(--muted); font-size: 14px; padding-bottom: 12px; }

  /* Tarjetas */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    padding-bottom: 48px;
  }
  .card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s, border-color .15s;
    min-width: 0;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--accent); }
  .card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-head svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .card h2 {
    margin: 0; font-size: 16px; font-weight: 600; color: var(--accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 8px; flex-shrink: 0;
  }
  .desc { margin: 0; color: var(--muted); font-size: 14px; flex: 1; overflow-wrap: anywhere; }
  .desc.empty { font-style: italic; opacity: .7; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic {
    font-size: 12px; font-weight: 500; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
  }
  .stats {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    font-size: 13px; color: var(--muted);
  }
  .stats span { display: inline-flex; align-items: center; gap: 5px; }
  .stats svg { width: 14px; height: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .links { display: flex; gap: 8px; margin-top: 2px; }
  .links a {
    font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }

  /* Estados */
  .state {
    grid-column: 1 / -1; text-align: center; color: var(--muted);
    padding: 48px 16px; border: 1px dashed var(--border); border-radius: 12px;
  }
  .skeleton { min-height: 150px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 0 32px; }
  footer a { color: var(--accent); }

  @media (max-width: 720px) {
    .profile { flex-direction: column; align-items: flex-start; gap: 16px; padding-top: 16px; }
    .avatar { width: 80px; height: 80px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .search { grid-column: 1 / -1; }
    .check { grid-column: 1 / -1; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema"></button>
  </div>

  <header class="profile" id="profile">
    <img class="avatar" id="avatar" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div>
      <h1 id="name">Cargando…</h1>
      <div class="login" id="login"></div>
      <p class="bio" id="bio"></p>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></svg>
      <input type="search" id="q" placeholder="Buscar repositorio…" aria-label="Buscar repositorio">
    </label>
    <select id="lang" aria-label="Filtrar por lenguaje"><option value="">Todos los lenguajes</option></select>
    <select id="sort" aria-label="Ordenar">
      <option value="updated">Recientes</option>
      <option value="stars">Más estrellas</option>
      <option value="name">Nombre (A-Z)</option>
      <option value="created">Fecha de creación</option>
    </select>
    <label class="check"><input type="checkbox" id="forks"> Mostrar forks</label>
  </div>
  <div class="count" id="count"></div>

  <main class="grid" id="grid">
    <div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div>
  </main>
</div>

<footer>
  Datos en vivo desde la <a href="https://docs.github.com/rest" target="_blank" rel="noopener">API de GitHub</a>
</footer>

<script>
  // ====== Configuración ======
  // Usa el usuario de la URL (usuario.github.io) o este por defecto.
  var USER = (function () {
    var h = location.hostname;
    if (/\.github\.io$/i.test(h)) return h.split(".")[0];
    return "JSerr5";
  })();

  // ====== Iconos ======
  var ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
    repo: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.71 1.71.75.75 0 0 1-1.06 1.06A2.5 2.5 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.71A2.5 2.5 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.09a.25.25 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>',
    fork: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 5.37v.88A.75.75 0 0 0 5.75 7h4.5a.75.75 0 0 0 .75-.75v-.88a2.25 2.25 0 1 1 1.5 0v.88A2.25 2.25 0 0 1 10.25 8.5h-1.5v2.13a2.25 2.25 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.88a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>',
    star: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .67.42l1.88 3.8 4.2.61a.75.75 0 0 1 .42 1.28l-3.04 2.96.72 4.18a.75.75 0 0 1-1.09.8L8 12.33l-3.76 1.97a.75.75 0 0 1-1.09-.8l.72-4.18L.83 6.36a.75.75 0 0 1 .42-1.28l4.2-.61L7.33.67A.75.75 0 0 1 8 .25Z"/></svg>',
    clock: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.99l2.03 1.2a.75.75 0 0 1-.76 1.3L7.37 8.83A.75.75 0 0 1 7 8.18V4.75a.75.75 0 0 1 1.5 0Z"/></svg>',
    people: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 5.5a3.5 3.5 0 1 1 5.9 2.55 5 5 0 0 1 2.94 4.44.75.75 0 0 1-1.5.05 3.5 3.5 0 0 0-6.99 0 .75.75 0 0 1-1.5-.05A5 5 0 0 1 3.8 8.05 3.5 3.5 0 0 1 2 5.5ZM11 4a3 3 0 0 1 1.65 5.5 4.5 4.5 0 0 1 2.35 3.95.75.75 0 0 1-1.5 0 3 3 0 0 0-2.13-2.87.75.75 0 0 1-.52-.71v-.36a.75.75 0 0 1 .4-.66A1.5 1.5 0 0 0 11 5.5a.75.75 0 0 1 0-1.5ZM5.5 3.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>',
    pin: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="m12.6 11.06-3.52 3.97a1.45 1.45 0 0 1-2.16 0L3.4 11.06a6 6 0 1 1 9.2 0ZM8 9.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>',
    link: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M7.78 3.22a.75.75 0 0 1 0 1.06L6.06 6a2.25 2.25 0 1 0 3.18 3.18l.47-.47a.75.75 0 1 1 1.06 1.06l-.47.47A3.75 3.75 0 1 1 5 4.94l1.72-1.72a.75.75 0 0 1 1.06 0Zm3.47-.47A3.75 3.75 0 0 1 11 9.06l-1.72 1.72a.75.75 0 1 1-1.06-1.06L9.94 8a2.25 2.25 0 1 0-3.18-3.18l-.47.47a.75.75 0 1 1-1.06-1.06l.47-.47a3.75 3.75 0 0 1 5.55-.01Z"/></svg>',
    gh: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>'
  };

  // Colores de lenguajes (los mismos que usa GitHub)
  var LANG_COLORS = {
    JavaScript: "#f1e05a", TypeScript: "#3178c6", Python: "#3572A5", Java: "#b07219",
    "C#": "#178600", "C++": "#f34b7d", C: "#555555", HTML: "#e34c26", CSS: "#563d7c",
    SCSS: "#c6538c", PHP: "#4F5D95", Ruby: "#701516", Go: "#00ADD8", Rust: "#dea584",
    Kotlin: "#A97BFF", Swift: "#F05138", Dart: "#00B4AB", Shell: "#89e051",
    PowerShell: "#012456", Vue: "#41b883", Svelte: "#ff3e00", "Jupyter Notebook": "#DA5B0B",
    R: "#198CE7", Lua: "#000080", "Objective-C": "#438eff", Dockerfile: "#384d54",
    GDScript: "#355570", Batchfile: "#C1F12E", SQL: "#e38c00", TSQL: "#e38c00", Astro: "#ff5a03"
  };

  // ====== Tema claro / oscuro ======
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  function currentTheme() {
    var t = root.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paintThemeBtn() {
    var dark = currentTheme() === "dark";
    themeBtn.innerHTML = (dark ? ICON.sun : ICON.moon) + "<span>" + (dark ? "Claro" : "Oscuro") + "</span>";
  }
  themeBtn.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paintThemeBtn();
  });
  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(paintThemeBtn);
  }
  paintThemeBtn();

  // ====== Utilidades ======
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) {
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return /^https?:\/\//i.test(u) ? u : "";
  }
  var rtf = window.Intl && Intl.RelativeTimeFormat ? new Intl.RelativeTimeFormat("es", { numeric: "auto" }) : null;
  function ago(iso) {
    var diff = (new Date(iso) - new Date()) / 1000;
    var units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
    for (var i = 0; i < units.length; i++) {
      if (Math.abs(diff) >= units[i][1] || units[i][0] === "minute") {
        var v = Math.round(diff / units[i][1]);
        return rtf ? rtf.format(v, units[i][0]) : new Date(iso).toLocaleDateString("es");
      }
    }
  }

  // Caché de 10 minutos por visitante para no gastar el límite de la API
  function cached(key, fetcher) {
    try {
      var raw = sessionStorage.getItem(key);
      if (raw) {
        var obj = JSON.parse(raw);
        if (Date.now() - obj.t < 10 * 60 * 1000) return Promise.resolve(obj.d);
      }
    } catch (e) {}
    return fetcher().then(function (d) {
      try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
      return d;
    });
  }
  function getJSON(url) {
    return fetch(url, { headers: { Accept: "application/vnd.github+json" } }).then(function (r) {
      if (r.status === 403 || r.status === 429) throw new Error("rate");
      if (r.status === 404) throw new Error("notfound");
      if (!r.ok) throw new Error("http");
      return r.json();
    });
  }
  function getAllRepos() {
    var all = [];
    function page(n) {
      return getJSON("https://api.github.com/users/" + USER + "/repos?per_page=100&type=owner&sort=updated&page=" + n)
        .then(function (list) {
          all = all.concat(list);
          return list.length === 100 && n < 10 ? page(n + 1) : all;
        });
    }
    return page(1);
  }

  // ====== Perfil ======
  function renderProfile(u) {
    document.getElementById("avatar").src = u.avatar_url;
    document.getElementById("avatar").alt = u.login;
    document.getElementById("name").textContent = u.name || u.login;
    document.getElementById("login").textContent = "@" + u.login;
    document.getElementById("bio").textContent = u.bio || "";
    document.title = (u.name || u.login) + " · Repositorios";
    var m = [];
    m.push('<a href="' + esc(u.html_url) + '" target="_blank" rel="noopener">' + ICON.gh + " GitHub</a>");
    m.push("<span>" + ICON.repo + " <b>" + u.public_repos + "</b> repos</span>");
    m.push("<span>" + ICON.people + " <b>" + u.followers + "</b> seguidores · <b>" + u.following + "</b> siguiendo</span>");
    if (u.location) m.push("<span>" + ICON.pin + " " + esc(u.location) + "</span>");
    var blog = safeUrl(u.blog);
    if (blog) m.push('<a href="' + esc(blog) + '" target="_blank" rel="noopener">' + ICON.link + " " + esc(u.blog.replace(/^https?:\/\//, "")) + "</a>");
    document.getElementById("meta").innerHTML = m.join("");
  }

  // ====== Repositorios ======
  var repos = [];
  var grid = document.getElementById("grid");
  var qEl = document.getElementById("q"), langEl = document.getElementById("lang"),
      sortEl = document.getElementById("sort"), forksEl = document.getElementById("forks"),
      countEl = document.getElementById("count");

  function card(r) {
    var color = LANG_COLORS[r.language] || "#8b949e";
    var topics = (r.topics || []).slice(0, 6).map(function (t) { return '<span class="topic">' + esc(t) + "</span>"; }).join("");
    var stats = [];
    if (r.language) stats.push('<span><i class="dot" style="background:' + color + '"></i>' + esc(r.language) + "</span>");
    if (r.stargazers_count) stats.push("<span>" + ICON.star + r.stargazers_count + "</span>");
    if (r.forks_count) stats.push("<span>" + ICON.fork + r.forks_count + "</span>");
    stats.push('<span title="' + esc(new Date(r.pushed_at).toLocaleString("es")) + '">' + ICON.clock + "Actualizado " + ago(r.pushed_at) + "</span>");
    var home = safeUrl(r.homepage);
    var links = '<a href="' + esc(r.html_url) + '" target="_blank" rel="noopener">Código</a>';
    if (home) links += '<a href="' + esc(home) + '" target="_blank" rel="noopener">Ver demo</a>';
    var badges = "";
    if (r.fork) badges += '<span class="badge">Fork</span>';
    if (r.archived) badges += '<span class="badge">Archivado</span>';
    return '<article class="card">' +
      '<div class="card-head">' + (r.fork ? ICON.fork : ICON.repo) +
      '<a href="' + esc(r.html_url) + '" target="_blank" rel="noopener" style="min-width:0"><h2 title="' + esc(r.name) + '">' + esc(r.name) + "</h2></a>" + badges + "</div>" +
      (r.description ? '<p class="desc">' + esc(r.description) + "</p>" : '<p class="desc empty">Sin descripción</p>') +
      (topics ? '<div class="topics">' + topics + "</div>" : "") +
      '<div class="stats">' + stats.join("") + "</div>" +
      '<div class="links">' + links + "</div>" +
      "</article>";
  }

  function render() {
    var q = qEl.value.trim().toLowerCase();
    var lang = langEl.value;
    var list = repos.filter(function (r) {
      if (!forksEl.checked && r.fork) return false;
      if (lang && r.language !== lang) return false;
      if (q) {
        var hay = (r.name + " " + (r.description || "") + " " + (r.topics || []).join(" ")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    var s = sortEl.value;
    list.sort(function (a, b) {
      if (s === "stars") return b.stargazers_count - a.stargazers_count || new Date(b.pushed_at) - new Date(a.pushed_at);
      if (s === "name") return a.name.localeCompare(b.name, "es", { sensitivity: "base" });
      if (s === "created") return new Date(b.created_at) - new Date(a.created_at);
      return new Date(b.pushed_at) - new Date(a.pushed_at);
    });
    countEl.textContent = list.length + (list.length === 1 ? " repositorio" : " repositorios");
    grid.innerHTML = list.length ? list.map(card).join("") : '<div class="state">No hay repositorios que coincidan.</div>';
  }

  function fillLanguages() {
    var seen = {};
    repos.forEach(function (r) { if (r.language) seen[r.language] = (seen[r.language] || 0) + 1; });
    Object.keys(seen).sort(function (a, b) { return seen[b] - seen[a]; }).forEach(function (l) {
      var o = document.createElement("option");
      o.value = l; o.textContent = l + " (" + seen[l] + ")";
      langEl.appendChild(o);
    });
  }

  function showError(err) {
    var msg = err && err.message === "rate"
      ? "GitHub limitó las consultas por un momento. Intenta de nuevo en unos minutos."
      : err && err.message === "notfound"
        ? "No se encontró el usuario «" + esc(USER) + "»."
        : "No se pudieron cargar los repositorios. Revisa tu conexión e inténtalo de nuevo.";
    grid.innerHTML = '<div class="state">' + msg + "</div>";
    countEl.textContent = "";
  }

  [qEl, langEl, sortEl, forksEl].forEach(function (el) {
    el.addEventListener(el.tagName === "INPUT" && el.type === "search" ? "input" : "change", render);
  });

  cached("gh-user-" + USER, function () { return getJSON("https://api.github.com/users/" + USER); })
    .then(renderProfile)
    .catch(function () { document.getElementById("name").textContent = USER; });

  cached("gh-repos-" + USER, getAllRepos)
    .then(function (list) {
      repos = list;
      // Si todos son forks, mostrarlos por defecto
      if (repos.length && repos.every(function (r) { return r.fork; })) forksEl.checked = true;
      fillLanguages();
      render();
    })
    .catch(showError);
</script>
</body>
</html>
